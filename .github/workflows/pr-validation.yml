name: Validasi PR Tugas Besar Pemweb (DEADLINE CLOSED)

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - master

jobs:
  reject-pr-deadline:
    name: ⛔ Penolakan Otomatis (Masa Deadline Telah Berakhir)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: ⛔ Tolak & Tutup Pull Request Otomatis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
        run: |
          echo "=========================================================================="
          echo "⛔ PENGUMUMAN: BATAS WAKTU (DEADLINE) PENGUMPULAN TUBES PEMWEB TELAH BERAKHIR"
          echo "=========================================================================="
          echo "Pull Request #${PR_NUMBER} dari @${PR_AUTHOR} ditolak secara otomatis."
          echo "Repositori utama telah dikunci untuk penerimaan perubahan kode baru."

          MSG="⛔ **Pull Request Ditolak dan Ditutup Otomatis: Batas Waktu (Deadline) Telah Berakhir**"
          MSG="${MSG}"$'\n\n'"Halo @${PR_AUTHOR},"
          MSG="${MSG}"$'\n\n'"Mohon maaf, Pull Request Anda tidak dapat diterima karena **batas waktu (deadline) pengumpulan Tugas Besar Praktikum Pemrograman Web 2026 telah resmi berakhir**."
          MSG="${MSG}"$'\n\n'"Repositori utama saat ini telah dikunci untuk penerimaan perubahan kode baru guna keperluan penilaian akhir dan audit rekapitulasi kontribusi tim."
          MSG="${MSG}"$'\n\n'"Apabila terdapat kendala teknis atau konfirmasi mendesak terkait pengumpulan kelompok, silakan segera menghubungi **Dosen Pengampu** atau **Tim Asisten Praktikum** melalui saluran komunikasi resmi praktikum."
          MSG="${MSG}"$'\n\n'"Terima kasih atas kerja keras dan dedikasi seluruh anggota kelompok!"

          gh pr close "${PR_NUMBER}" --repo "${REPO}" --comment "${MSG}"

          # Keluar dengan kode error agar status check CI/CD bertanda silang merah (failed)
          exit 1

# ==============================================================================
# ARSIP WORKFLOW VALIDASI SEBELUM DEADLINE (PRE-DEADLINE ARCHIVE)
# ==============================================================================
# Di bawah ini adalah konfigurasi validasi sebelum deadline berakhir (disimpan
# sebagai arsip untuk referensi praktikum periode berikutnya):
#
# steps:
#   - 1. Checkout Repository (actions/checkout@v4 ref: ${{ github.event.pull_request.head.sha }})
#   - 2. Cek Isolasi Folder Kelompok & File Terlarang (hanya kelompok/kelompok_XX/)
#   - 3. Cek Ukuran File (Maksimal 5MB per file)
#   - 4. Setup PHP Environment (shivammathur/setup-php@v2 php 8.2)
#   - 5. Validasi Kepemilikan Fork Kelompok (validate_fork.php)
#   - 6. Cek Sintaks PHP Native (php -l)
#   - 7. Buat & Kirim Rekapitulasi Kontribusi Anggota ke PR (pr_rekap_kontribusi.php)
#   - 8. Auto-Merge PR Jika Lolos Semua Validasi (gh pr merge)
#   - 9. Auto-Close PR Jika Gagal Validasi CI/CD (gh pr close)
